name: Keep Streamlit App Awake

on:
  schedule:
    # 매일 자정(UTC 기준 0시)에 실행됩니다. (24시간 주기)
    - cron: '0 0 * * *'
  workflow_dispatch: # 수동으로도 Actions 탭에서 실행할 수 있게 해주는 옵션입니다.

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          # 접속을 유지할 Streamlit 앱 URL
          curl -s "https://mega-medical-ai.streamlit.app/" > /dev/null
